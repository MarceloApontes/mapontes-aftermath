<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MAPONTES: AFTERMATH — Etapa 024</title>
<style>
html,body{height:100%;width:100%;margin:0;overflow:hidden;background:#10191b}
#game{display:block;width:100%;height:100%;touch-action:none}
#fatal{display:none;position:fixed;inset:20px auto auto 20px;max-width:85vw;background:#311;color:white;padding:16px;border:1px solid #f88;border-radius:8px;z-index:999;font:14px system-ui}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="fatal"></div>
<script src="https://cdn.babylonjs.com/babylon.js"></script>
<script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
<script type="module">
const canvas=document.querySelector('#game');
const engine=new BABYLON.Engine(canvas,true,{preserveDrawingBuffer:true,stencil:true});
window.engine=engine;
try {
 const {createScene}=await import('./src/playground-etapa-024.js?v=024');
 const scene=await createScene();
 if(!scene)throw new Error('createScene não retornou uma cena.');
 engine.runRenderLoop(()=>scene.render());
 window.addEventListener('resize',()=>engine.resize());
 console.info('[AFTERMATH] Etapa 024 iniciada com sucesso');
} catch(error) {
 console.error('[AFTERMATH] Falha ao iniciar jogo',error);
 const box=document.querySelector('#fatal');
 box.style.display='block';
 box.textContent='Falha ao iniciar o MAPONTES: AFTERMATH — '+(error?.message||error);
}
</script>
</body>
</html>
